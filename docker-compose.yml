version: '3.8'

services:
  mcp-crawl4ai-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-crawl4ai-rag
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8054:8054"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8054
      - TRANSPORT=sse
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_NO_CACHE_DIR=1
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - .:/app
      - /app/logs
      - /app/.cache
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8054/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./crawled_pages.sql:/docker-entrypoint-initdb.d/crawled_pages.sql
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgREST API for Supabase compatibility
  postgrest:
    image: postgrest/postgrest:v12.0.1
    container_name: postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PGRST_DB_SCHEMA=public
      - PGRST_DB_ANON_ROLE=postgres
      - PGRST_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
      - PGRST_JWT_AUD=authenticated
      - PGRST_LOG_LEVEL=info
      - PGRST_SECRET_IS_BASE64=false
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
    ports:
      - "127.0.0.1:7475:7474"  # Changed from 7474 to avoid conflict
      - "127.0.0.1:7688:7687"  # Changed from 7687 to avoid conflict
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  mcp-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

